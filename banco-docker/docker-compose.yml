services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banco-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-mysql-3f9eaa80-sistema-basededatos.i.aivencloud.com}
      DB_PORT: ${DB_PORT:-24201}
      DB_NAME: ${DB_NAME:-banco_digital}
      DB_USER: ${DB_USER:-avnadmin}
      DB_PASS: ${DB_PASS}
      DB_SSL: ${DB_SSL:-1}
      BANCO_JWT_SECRET: ${BANCO_JWT_SECRET:-esmeraldas_nexo_bank_secret_key_2026_jwt_token}
      BANCO_DEMO_LOGIN: ${BANCO_DEMO_LOGIN:-1}
      KEYCLOAK_ALLOWED_ISSUERS: ${KEYCLOAK_ALLOWED_ISSUERS:-http://localhost:8080/realms/Banco,http://127.0.0.1:8080/realms/Banco}
      KEYCLOAK_REALM_URL: ${KEYCLOAK_REALM_URL:-http://host.docker.internal:8080/realms/Banco}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: banco-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
