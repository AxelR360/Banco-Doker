services:
  mysql:
    image: mysql:8.4
    container_name: banco-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-banco_local_root}
      MYSQL_USER: ${MYSQL_USER:-banco_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-12345}
      MYSQL_DATABASE: banco_digital
      TZ: America/Guayaquil
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin-trust-function-creators=1
    volumes:
      - mysql_data:/var/lib/mysql                      # los datos persisten (RNF-07)
      - ./init:/docker-entrypoint-initdb.d:ro          # se ejecuta solo la primera vez
    healthcheck:
      test: ['CMD-SHELL', 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" banco_digital -e "SELECT 1 FROM usuarios LIMIT 1"']
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: banco-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
    ports:
      - "127.0.0.1:8081:80"

  keycloak:
    # FIX: Usar el Dockerfile propio (optimizado con realm pre-cargado y config ligera)
    build:
      context: ./keycloak
      dockerfile: Dockerfile
    container_name: banco-keycloak
    restart: unless-stopped
    ports:
      - "127.0.0.1:8085:8080"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banco-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: banco_digital
      DB_USER: ${MYSQL_USER:-banco_user}
      DB_PASS: ${MYSQL_PASSWORD:-12345}
      BANCO_JWT_SECRET: ${BANCO_JWT_SECRET:-}
      BANCO_DEMO_LOGIN: "1"
      KEYCLOAK_ALLOWED_ISSUERS: ${KEYCLOAK_ALLOWED_ISSUERS:-http://localhost:8085/realms/banco-digital,http://127.0.0.1:8085/realms/banco-digital}
      KEYCLOAK_REALM_URL: http://keycloak:8080/realms/banco-digital
    # FIX: NO montar ./backend como volumen para evitar sobreescribir vendor/ del build.
    # Si necesitas hot-reload en desarrollo, descomenta solo src/ y public/:
    # volumes:
    #   - ./backend/src:/var/www/html/src
    #   - ./backend/public:/var/www/html/public
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: banco-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
    depends_on:
      - backend
      - mysql

volumes:
  mysql_data:
