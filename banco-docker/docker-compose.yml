services:
  mysql:
    image: mysql:8.4
    container_name: banco-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: America/Guayaquil
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin-trust-function-creators=1
    volumes:
      - mysql_data:/var/lib/mysql                      # los datos persisten (RNF-07)
      - ./init:/docker-entrypoint-initdb.d:ro          # se ejecuta solo la primera vez
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: banco-phpmyadmin
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: banco-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/banco-realm.json:/opt/keycloak/data/import/banco-realm.json:ro
    ports:
      - "8085:8080"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: banco-backend
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: banco_digital
      DB_USER: ${MYSQL_USER:-banco_user}
      DB_PASS: ${MYSQL_PASSWORD:-12345}
      BANCO_JWT_SECRET: ${BANCO_JWT_SECRET:-super_secret_jwt_key_banco_digital_2026_segura_utlvte_faci}
      KEYCLOAK_REALM_URL: http://keycloak:8080/realms/banco-digital
    volumes:
      - ./backend:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: banco-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - mysql

volumes:
  mysql_data:
